name: monitor

on:
  schedule:
    # Every 5 minutes, deliberately offset off the hour boundary.
    #
    # GitHub's scheduler is best effort: runs are delayed under load and may be
    # dropped entirely, and its docs single out the start of every hour as the
    # worst time. A plain */10 fires exactly on that boundary and measured
    # 16-26 minutes apart in practice. Asking for 5 minutes off the boundary
    # lands nearer the 10 minutes we actually want.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs overlap; both would write the same sheet rows.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No install step: the project has zero runtime dependencies, so there is
      # nothing to fetch. This cut roughly three minutes off every run.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check listings
        run: node src/index.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          PLAY_REGION: ${{ vars.PLAY_REGION }}
          CONCURRENCY: ${{ vars.CONCURRENCY }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          # One-time bootstrap. Set the repository variable SUPPRESS_ALERTS to
          # "true", let a run complete, then DELETE the variable. State changes
          # are recorded but no WhatsApp message is sent.
          SUPPRESS_ALERTS: ${{ vars.SUPPRESS_ALERTS }}
