name: monitor

on:
  schedule:
    # Every 10 minutes. GitHub may delay or drop runs under load.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs overlap; both would write the same sheet rows.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check listings
        run: node src/index.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          PLAY_REGION: ${{ vars.PLAY_REGION }}
          CONCURRENCY: ${{ vars.CONCURRENCY }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          # One-time bootstrap. Set the repository variable SUPPRESS_ALERTS to
          # "true", let a run complete, then DELETE the variable. State changes
          # are recorded but no WhatsApp message is sent.
          SUPPRESS_ALERTS: ${{ vars.SUPPRESS_ALERTS }}
